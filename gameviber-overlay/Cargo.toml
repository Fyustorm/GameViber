[package]
name = "gameviber-overlay"
version = "0.1.0"
edition = "2021"
description = "In-game overlay for GameViber: an implicit Vulkan layer"

[lib]
crate-type = ["cdylib"]

[dependencies]
ash = { version = "0.38", default-features = false, features = ["std", "debug"] }
epaint = "0.36"
glow = "0.17"
gameviber-common = { path = "../gameviber-common", features = ["overlay"] }
libc = "0.2"
serde_json = "1"

[build-dependencies]
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
