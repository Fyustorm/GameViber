# One SQLite file and the shared mode packages, in DATA_DIR.
data.dir=${DATA_DIR:data}
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${data.dir}/gameviber.db?journal_mode=WAL&foreign_keys=on&busy_timeout=5000
# SQLite takes one writer at a time.
quarkus.datasource.jdbc.max-size=4
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.yaml
quarkus.native.container-build=true

# Behind a reverse proxy: the client's address is the one it forwards (rate limits).
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
# A package is 64 MB at most, and the form around it.
quarkus.http.limits.max-body-size=70M
quarkus.http.body.uploads-directory=${data.dir}/uploads

quarkus.smallrye-openapi.info-title=GameViber community
quarkus.swagger-ui.always-include=true

# Tokens: authors sign in for 30 days; an administration session lasts a working day.
mp.jwt.verify.issuer=gameviber
smallrye.jwt.sign.key-format=JWK
smallrye.jwt.sign.key.algorithm=HS256
smallrye.jwt.verify.key-format=JWK
smallrye.jwt.verify.algorithm=HS256
# Production signs with a key of its own (never the dev key): a leaked key forges any token.
smallrye.jwt.sign.key.location=${JWT_KEY_FILE:}
smallrye.jwt.verify.key.location=${JWT_KEY_FILE:}
%dev.smallrye.jwt.sign.key.location=dev-secret.jwk
%dev.smallrye.jwt.verify.key.location=dev-secret.jwk
%test.smallrye.jwt.sign.key.location=dev-secret.jwk
%test.smallrye.jwt.verify.key.location=dev-secret.jwk
author.session-duration=P30D
admin.session-duration=PT8H
# The operations token, traded for an administration session; unset, nobody administers.
admin.token=${ADMIN_TOKEN:}
%dev.admin.token=dev
%test.admin.token=test-admin

# Per client address.
limits.sign-in-per-hour=${LIMIT_SIGN_IN_PER_HOUR:20}
limits.publish-per-hour=${LIMIT_PUBLISH_PER_HOUR:20}
limits.report-per-hour=${LIMIT_REPORT_PER_HOUR:10}
%test.limits.sign-in-per-hour=1000
%test.limits.publish-per-hour=1000

%dev.quarkus.http.host=0.0.0.0
%test.data.dir=target/test-data
