[workspace]
members = ["gameviber-common", "gameviber-ebpf", "gameviber", "gameviber-overlay"]
# gameviber-ebpf is no_std/no_main: it is only built through aya-build
# (gameviber/build.rs), never directly for the host target.
default-members = ["gameviber-common", "gameviber", "gameviber-overlay"]
resolver = "2"

[profile.release]
lto = true
strip = true
