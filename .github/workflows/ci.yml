# Tests, and the check that the code outside `linux` modules builds for
# Windows (AGENTS.md, Platforms).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The eBPF probe is built by the release workflow.
  SKIP_EBPF_BUILD: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: tools/check-windows.sh
