# Builds the Linux packages (deb, rpm, Arch) and the archive, with
# packaging/linux/package.sh, on Ubuntu 24.04, and the Windows installer and
# archive, with packaging/windows/package.sh. On a v* tag (v0.1.0-alpha.1), they are attached
# to a draft GitHub release, published by hand. Nothing goes to any store or
# package repository.
name: Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The community server the released app talks to (`community::URL`).
  GAMEVIBER_COMMUNITY_URL: https://api.gameviber.fyustorm.ovh
  BPF_LINKER_VERSION: v0.11.1
  NFPM_VERSION: v2.47.0
  CARGO_ABOUT_VERSION: 0.9.2
  INNO_SETUP_VERSION: 6.7.3

jobs:
  build:
    runs-on: ubuntu-24.04
    # The oldest glibc the prebuilt ONNX Runtime links with (2.39): the
    # binaries run on every distribution since (Ubuntu 24.04, Debian 13,
    # Fedora 40, Arch, SteamOS 3.7).
    container: ubuntu:24.04
    steps:
      - name: System packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++ pkg-config libssl-dev libwayland-dev \
            ca-certificates curl git zstd
      - uses: actions/checkout@v4
      - name: Rust (stable, 32-bit target, nightly for the eBPF probe)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustup target add i686-unknown-linux-gnu
          rustup toolchain install nightly --profile minimal --component rust-src
      - name: bpf-linker, nfpm and cargo-about
        run: |
          curl -sSfL "https://github.com/aya-rs/bpf-linker/releases/download/$BPF_LINKER_VERSION/bpf-linker-x86_64-unknown-linux-musl.tar.zst" \
            | tar --zstd -x -C /usr/local/bin bpf-linker
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/$NFPM_VERSION/nfpm_${NFPM_VERSION#v}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm
          curl -sSfL "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl/cargo-about"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' gameviber/Cargo.toml | head -n1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but gameviber/Cargo.toml says $version"; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --release
          cargo build-overlay32
      - name: Package
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: target/package/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup default stable
      - name: cargo-about and Inno Setup
        run: |
          curl -sSfL "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/cargo-about-$CARGO_ABOUT_VERSION-x86_64-pc-windows-msvc.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" --strip-components=1 "cargo-about-$CARGO_ABOUT_VERSION-x86_64-pc-windows-msvc/cargo-about.exe"
          curl -sSfL -o innosetup.exe "https://github.com/jrsoftware/issrc/releases/download/is-${INNO_SETUP_VERSION//./_}/innosetup-$INNO_SETUP_VERSION.exe"
          ./innosetup.exe //VERYSILENT //SUPPRESSMSGBOXES //CURRENTUSER //DIR="C:\inno"
          echo "ISCC=/c/inno/ISCC.exe" >> "$GITHUB_ENV"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' gameviber/Cargo.toml | head -n1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but gameviber/Cargo.toml says $version"; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p gameviber
      - name: Package
        run: packaging/windows/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: target/package/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - name: SHA256SUMS of every file
        run: cd packages && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" \
            --draft $prerelease --title "GameViber ${GITHUB_REF_NAME#v}" --generate-notes
