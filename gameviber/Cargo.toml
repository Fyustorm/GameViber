[package]
name = "gameviber"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
aya = "0.14"
buttplug = "12"
buttplug_core = "11"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
eframe = "0.36"
egui_plot = "0.37"
env_logger = "0.11"
evdev = "0.13"
gameviber-common = { path = "../gameviber-common", features = ["user"] }
libc = "0.2"
log = "0.4"
mlua = { version = "0.12", features = ["luau"] }
# CLAP audio scene model (docs/spec-modes.md §6.3); ONNX Runtime is linked statically.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native", "api-22"] }
raw-window-handle = "0.6"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["full"] }
# Values and events other programs send (docs/spec-modes.md §6.5).
tokio-tungstenite = "0.30"
toml = "1"
ureq = "3"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
aya-build = "0.2"
