[package]
name = "gameviber"
version = "0.1.0-alpha.4"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
buttplug = "12"
buttplug_core = "11"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
eframe = "0.36"
egui_plot = "0.37"
env_logger = "0.11"
gameviber-common = { path = "../gameviber-common", features = ["user"] }
log = "0.4"
mlua = { version = "0.12", features = ["luau"] }
# Captures of the game's image kept in game profiles.
png = "0.18"
# Images imported as captures (`game::read_image`).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
# CLAP audio scene model (docs/spec-modes.md §6.3); ONNX Runtime is linked statically.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native", "api-22"] }
rustfft = "6"
# Updates: comparing versions, checking downloads.
semver = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["full"] }
# Values and events other programs send (docs/spec-modes.md §6.5).
tokio-tungstenite = "0.30"
toml = "1"
ureq = "3"
# Modes shared with their game (`sharing.rs`).
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

# Linux only: everything that uses them lives in `linux` modules (AGENTS.md, Platforms).
[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14"
evdev = "0.13"
libc = "0.2"
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Windows only: everything that uses them lives in `windows` modules (AGENTS.md, Platforms).
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
aya-build = "0.2"
