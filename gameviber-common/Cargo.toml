[package]
name = "gameviber-common"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR GPL-2.0-or-later"

[features]
default = []
# Enabled in userspace; absent when the crate is compiled into the eBPF program.
user = ["overlay"]
# The in-game overlay protocol alone: also built for 32-bit games.
overlay = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
